<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indian Sectors &amp; Stock Performance</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --text: #1a1d21;
    --muted: #667085; --head: #0f172a; --accent: #2563eb;
    --pos: #067647; --pos-bg: #ecfdf3; --neg: #b42318; --neg-bg: #fef3f2;
    --row-alt: #fafbfc; --shadow: 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #0b0e14; --panel: #141922; --border: #232a36; --text: #e6e9ef;
      --muted: #93a0b4; --head: #e6e9ef; --accent: #6ea8ff;
      --pos: #4ade80; --pos-bg: #0f2a1c; --neg: #f87171; --neg-bg: #2a1315;
      --row-alt: #10151d; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14; --panel: #141922; --border: #232a36; --text: #e6e9ef;
    --muted: #93a0b4; --head: #e6e9ef; --accent: #6ea8ff;
    --pos: #4ade80; --pos-bg: #0f2a1c; --neg: #f87171; --neg-bg: #2a1315;
    --row-alt: #10151d; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 18px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
  header p { margin: 2px 0; color: var(--muted); font-size: 13.5px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 20px 0 8px; }
  .toolbar input, .toolbar select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; font-size: 14px; }
  .toolbar input { flex: 1 1 220px; min-width: 160px; }
  .toolbar label { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button.theme { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    cursor: pointer; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); margin: 16px 0; overflow: hidden; }
  .panel > h2 { margin: 0; padding: 14px 16px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; user-select: none; }
  .panel > h2 .idx { color: var(--muted); font-weight: 500; font-size: 12.5px;
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }
  .panel > h2 .caret { color: var(--muted); font-size: 12px; transition: transform .15s; }
  .panel.collapsed > h2 .caret { transform: rotate(-90deg); }
  .panel .body { border-top: 1px solid var(--border); }
  .panel.collapsed .body { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 9px 12px; white-space: nowrap; }
  th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
    border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; }
  thead th.sorted::after { content: " ▾"; color: var(--accent); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  td.sym { font-weight: 600; }
  td.name { color: var(--muted); max-width: 260px; overflow: hidden;
    text-overflow: ellipsis; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 600; border-radius: 6px;
    padding: 2px 7px; display: inline-block; min-width: 62px; text-align: right; }
  .pct.pos { color: var(--pos); background: var(--pos-bg); }
  .pct.neg { color: var(--neg); background: var(--neg-bg); }
  .pct.na { color: var(--muted); background: transparent; font-weight: 500; }
  tr.avg td { border-top: 2px solid var(--border); font-weight: 700; background: transparent; }
  tr.avg td.sym { text-transform: uppercase; letter-spacing: .03em; font-size: 12px; color: var(--muted); }
  .flag { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .overview td.name { color: var(--text); font-weight: 600; cursor: pointer; }
  .overview td.name:hover { color: var(--accent); }
  .note { color: var(--muted); font-size: 12.5px; margin: 10px 2px; }
  .err { background: var(--neg-bg); color: var(--neg); padding: 16px;
    border-radius: 10px; border: 1px solid var(--border); }
  code { background: var(--row-alt); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Indian Sectors &amp; Stock Performance</h1>
    <p id="meta">Loading…</p>
    <p>Sector groupings follow <strong>NSE sectoral indices</strong>; prices &amp; returns from
       <strong>Yahoo Finance</strong> (adjusted close). Growth % over 3 / 6 / 9 / 12 months.</p>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Filter stocks or sectors (e.g. HDFC, pharma)…" autocomplete="off">
    <span class="spacer"></span>
    <label for="sortsel">Sort by</label>
    <select id="sortsel">
      <option value="12m">12 months</option>
      <option value="9m">9 months</option>
      <option value="6m">6 months</option>
      <option value="3m">3 months</option>
      <option value="name">Name</option>
    </select>
    <button class="theme" id="themebtn" title="Toggle theme">◐ Theme</button>
  </div>

  <div id="root"></div>

  <p class="note" id="disclaimer"></p>
</div>

<script>
const PERIODS = ["3m","6m","9m","12m"];
const state = { data: null, sort: "12m", q: "", collapsed: new Set() };

function fmtPct(v) {
  if (v === null || v === undefined) return '<span class="pct na">—</span>';
  const cls = v >= 0 ? "pos" : "neg";
  const sign = v >= 0 ? "+" : "";
  return `<span class="pct ${cls}">${sign}${v.toFixed(2)}%</span>`;
}

function shortHistoryFlag(st) {
  // Flag figures backed by clearly less history than the period implies.
  if (!st.ok) return "";
  const h = st.history_days || 0;
  if (h < 340) return `<span class="flag" title="Only ${Math.round(h)} days of price history — recent listing/demerger; long-period figures are partial">⚠ ${Math.round(h)}d</span>`;
  return "";
}

function sortStocks(stocks, key) {
  const arr = stocks.slice();
  if (key === "name") {
    arr.sort((a,b) => (a.name||"").localeCompare(b.name||""));
  } else {
    arr.sort((a,b) => {
      const av = a.returns ? a.returns[key] : null;
      const bv = b.returns ? b.returns[key] : null;
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      return bv - av;
    });
  }
  return arr;
}

function stockRow(st) {
  const cells = PERIODS.map(p => `<td>${fmtPct(st.returns ? st.returns[p] : null)}</td>`).join("");
  const price = st.ok && st.price != null ? st.price.toLocaleString("en-IN") : "—";
  return `<tr>
    <td class="sym">${st.symbol}${shortHistoryFlag(st)}</td>
    <td class="name" title="${st.long_name||st.name}">${st.name}</td>
    <td>${price}</td>
    ${cells}
  </tr>`;
}

function sectorPanel(sec) {
  const collapsed = state.collapsed.has(sec.key) ? "collapsed" : "";
  let stocks = sortStocks(sec.stocks, state.sort);
  if (state.q) {
    const q = state.q.toLowerCase();
    stocks = stocks.filter(s =>
      s.symbol.toLowerCase().includes(q) || (s.name||"").toLowerCase().includes(q));
  }
  const th = PERIODS.map(p =>
    `<th class="${state.sort===p?'sorted':''}" data-sort="${p}">${p.replace('m',' M')}</th>`).join("");
  const rows = stocks.map(stockRow).join("");
  const avg = sec.average_returns || {};
  const avgCells = PERIODS.map(p => `<td>${fmtPct(avg[p])}</td>`).join("");
  return `<section class="panel ${collapsed}" data-key="${sec.key}">
    <h2 data-toggle="${sec.key}">
      <span class="caret">▾</span>${sec.name}
      <span class="idx">${sec.nse_index} · ${sec.num_ok}/${sec.num_stocks}</span>
    </h2>
    <div class="body">
      <table>
        <thead><tr>
          <th data-sort="name">Symbol</th><th>Company</th><th>Price (₹)</th>${th}
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="7" class="name">No matches.</td></tr>`}</tbody>
        <tfoot><tr class="avg">
          <td class="sym">Avg</td><td class="name">Equal-weighted sector average</td><td></td>${avgCells}
        </tr></tfoot>
      </table>
    </div>
  </section>`;
}

function overviewPanel(sectors) {
  const th = PERIODS.map(p =>
    `<th class="${state.sort===p?'sorted':''}" data-sort="${p}">${p.replace('m',' M')}</th>`).join("");
  const secs = sectors.slice().sort((a,b) => {
    if (state.sort === "name") return a.name.localeCompare(b.name);
    const av = a.average_returns[state.sort], bv = b.average_returns[state.sort];
    if (av === null) return 1; if (bv === null) return -1; return bv - av;
  });
  const rows = secs.map(s => {
    const cells = PERIODS.map(p => `<td>${fmtPct(s.average_returns[p])}</td>`).join("");
    return `<tr><td class="sym">${s.num_ok}</td>
      <td class="name" data-goto="${s.key}">${s.name}</td>
      <td style="color:var(--muted)">${s.nse_index}</td>${cells}</tr>`;
  }).join("");
  return `<section class="panel overview" data-key="__overview">
    <h2 data-toggle="__overview"><span class="caret">▾</span>Sector Overview
      <span class="idx">${sectors.length} sectors · equal-weighted</span></h2>
    <div class="body"><table>
      <thead><tr><th>#</th><th>Sector</th><th>NSE Index</th>${th}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </section>`;
}

function render() {
  const root = document.getElementById("root");
  if (!state.data) return;
  const secs = state.data.sectors;
  root.innerHTML = overviewPanel(secs) + secs.map(sectorPanel).join("");
}

function wire() {
  document.getElementById("root").addEventListener("click", e => {
    const toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      const k = toggle.getAttribute("data-toggle");
      state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
      render(); return;
    }
    const goto = e.target.closest("[data-goto]");
    if (goto) {
      const k = goto.getAttribute("data-goto");
      state.collapsed.delete(k);
      render();
      const el = document.querySelector(`.panel[data-key="${k}"]`);
      if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    const sortTh = e.target.closest("th[data-sort]");
    if (sortTh) {
      state.sort = sortTh.getAttribute("data-sort");
      document.getElementById("sortsel").value = state.sort;
      render();
    }
  });
  document.getElementById("search").addEventListener("input", e => {
    state.q = e.target.value.trim(); render();
  });
  document.getElementById("sortsel").addEventListener("change", e => {
    state.sort = e.target.value; render();
  });
  document.getElementById("themebtn").addEventListener("click", () => {
    const html = document.documentElement;
    const cur = html.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "auto" : "dark");
    html.setAttribute("data-theme", next);
  });
}

function applyMeta(m) {
  document.getElementById("meta").innerHTML =
    `Generated <strong>${m.generated_at}</strong> · ${m.num_sectors} sectors · `+
    `${m.num_ok}/${m.num_unique_stocks} stocks with live data`;
  document.getElementById("disclaimer").innerHTML =
    `${m.return_type}. Sector figures are the ${m.sector_aggregate.toLowerCase()} `+
    `(not the official free-float index return). Rows marked ⚠ have limited price history `+
    `(recent listing, merger or demerger) so their longer-period figures are partial. `+
    `Data is informational, not investment advice.`;
}

async function load() {
  try {
    const res = await fetch("output/sector_performance.json", {cache: "no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.data = await res.json();
    applyMeta(state.data.meta);
    render();
  } catch (err) {
    document.getElementById("root").innerHTML =
      `<div class="err"><strong>Could not load data.</strong><br>
       Generate it first with <code>python run.py generate</code>, then serve this page
       (browsers block <code>fetch</code> over <code>file://</code>):<br><br>
       <code>python -m http.server 8000</code> &nbsp;→&nbsp; open
       <code>http://localhost:8000/</code><br><br>
       <span style="color:var(--muted)">(${err.message})</span></div>`;
    document.getElementById("meta").textContent = "No data loaded.";
  }
}

wire();
load();
</script>
</body>
</html>
