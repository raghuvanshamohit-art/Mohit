<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 790" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="navy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1E3A5F"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E7D5B"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B23B2E"/></marker>
    <marker id="brown" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7A5230"/></marker>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(37)">
      <path d="M0,0 L0,8 M0,0 L8,0" stroke="#33485A" stroke-width="1.3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1150" height="790" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="575" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#15263F">In-house Floating-Debris Skimmer &#8212; Sub-tank to Sub-tank Surface Transfer</text>
  <text x="575" y="60" text-anchor="middle" font-size="14.5" fill="#5E6B78">Draw from the SURFACE &#183; filter at the fall &#183; return CLEAN water to the pump &#8212; no purchase, no power</text>

  <!-- Spray / return (top-left) -->
  <text x="120" y="112" font-size="12.5" fill="#15263F" font-weight="600">From main spray tank &#8212; sprays onto body</text>
  <rect x="120" y="120" width="300" height="12" rx="3" fill="#5A6B7A"/>
  <line x1="170" y1="134" x2="170" y2="184" stroke="#1E3A5F" stroke-width="2" marker-end="url(#navy)"/>
  <line x1="250" y1="134" x2="250" y2="184" stroke="#1E3A5F" stroke-width="2" marker-end="url(#navy)"/>
  <line x1="330" y1="134" x2="330" y2="184" stroke="#1E3A5F" stroke-width="2" marker-end="url(#navy)"/>
  <text x="120" y="210" font-size="11.5" font-style="italic" fill="#B23B2E">returns dirty: lint &#183; marker fibre &#183; oil &#183; metal</text>
  <line x1="180" y1="218" x2="195" y2="284" stroke="#B23B2E" stroke-width="1.6" marker-end="url(#red)"/>
  <line x1="270" y1="218" x2="270" y2="284" stroke="#B23B2E" stroke-width="1.6" marker-end="url(#red)"/>
  <line x1="360" y1="218" x2="345" y2="284" stroke="#B23B2E" stroke-width="1.6" marker-end="url(#red)"/>

  <!-- Tank walls -->
  <rect x="66" y="288" width="1018" height="312" rx="6" fill="none" stroke="#2A3A4A" stroke-width="5"/>
  <!-- partition wall (weir crest at top) -->
  <rect x="460" y="300" width="9" height="295" fill="#2A3A4A"/>

  <!-- LEFT (dirty) water -->
  <rect x="71" y="300" width="389" height="295" fill="#CFE6F2"/>
  <rect x="71" y="293" width="389" height="9" fill="#B9A24A"/>
  <g fill="#6E5B1E">
    <circle cx="120" cy="298" r="2.2"/><circle cx="150" cy="297" r="1.8"/><circle cx="185" cy="298" r="2.4"/><circle cx="225" cy="297" r="1.9"/><circle cx="265" cy="298" r="2.3"/><circle cx="305" cy="297" r="1.7"/><circle cx="345" cy="298" r="2.2"/><circle cx="390" cy="298" r="2"/><circle cx="428" cy="297" r="2.3"/>
  </g>
  <text x="90" y="336" font-size="12.5" font-weight="700" fill="#6E5B1E">Floating scum layer</text>
  <text x="90" y="353" font-size="11.5" fill="#6E5B1E">(lint, marker fibre, oil) &#8212; magnets can't catch it</text>
  <text x="150" y="474" font-size="14" font-weight="700" fill="#3E6FA3">DIRTY SUB-TANK</text>
  <text x="150" y="493" font-size="11" fill="#5E6B78">(spray water returns here)</text>

  <!-- RIGHT (clean) water -->
  <rect x="469" y="446" width="611" height="149" fill="#E4F3FB"/>
  <text x="650" y="502" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D5B">CLEAN SUB-TANK</text>
  <text x="650" y="521" text-anchor="middle" font-size="11" fill="#5E6B78">(feeds the recirculation pump)</text>

  <!-- Weir spill arrow -->
  <path d="M450,298 C468,300 470,308 478,314" fill="none" stroke="#1E3A5F" stroke-width="2.6" marker-end="url(#navy)"/>
  <!-- badge 1 -->
  <circle cx="455" cy="272" r="15" fill="#D99A16"/><text x="455" y="277" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="455" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15263F">Surface weir</text>
  <text x="455" y="250" text-anchor="middle" font-size="11" fill="#5E6B78">skims the TOP film</text>

  <!-- Inclined SS-mesh screen (bold diagonal band) -->
  <polygon points="466,300 628,424 620,442 458,318" fill="url(#mesh)" stroke="#33485A" stroke-width="2.2"/>
  <!-- debris on top of screen -->
  <g fill="#7A5230" stroke="#4E3316" stroke-width="0.6">
    <ellipse cx="506" cy="330" rx="8" ry="3.6" transform="rotate(37 506 330)"/>
    <ellipse cx="545" cy="360" rx="6.5" ry="3.2" transform="rotate(37 545 360)"/>
    <ellipse cx="580" cy="387" rx="8.5" ry="3.8" transform="rotate(37 580 387)"/>
    <ellipse cx="606" cy="407" rx="6" ry="3" transform="rotate(37 606 407)"/>
  </g>
  <!-- clean water passes through into right tank -->
  <line x1="596" y1="428" x2="596" y2="452" stroke="#2E7D5B" stroke-width="2" marker-end="url(#green)"/>
  <line x1="618" y1="438" x2="618" y2="452" stroke="#2E7D5B" stroke-width="2" marker-end="url(#green)"/>
  <text x="636" y="470" font-size="11" font-style="italic" fill="#2E7D5B">clean water drips through</text>

  <!-- badge 2 -->
  <circle cx="662" cy="300" r="15" fill="#D99A16"/><text x="662" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="684" y="296" font-size="12.5" font-weight="700" fill="#15263F">Inclined SS-mesh screen (static run-down)</text>
  <text x="684" y="313" font-size="11" fill="#5E6B78">solids stay on top &#183; water drains through the mesh</text>

  <!-- rake debris to tray (dirty side) -->
  <rect x="388" y="300" width="54" height="15" rx="2" fill="#8A6A3A" stroke="#5A431F"/>
  <path d="M545,352 C500,336 470,326 448,318" fill="none" stroke="#7A5230" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#brown)"/>
  <text x="388" y="336" font-size="10.5" fill="#5A431F">rake debris off &#8594; tray (each shift)</text>

  <!-- Baffle -->
  <rect x="800" y="360" width="9" height="182" fill="#9AA7B2" stroke="#6E7C88"/>
  <rect x="782" y="352" width="45" height="9" fill="#6E7C88"/>
  <circle cx="762" cy="368" r="15" fill="#D99A16"/><text x="762" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="804" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#15263F">Baffle &#8212; stops surface film</text>

  <!-- Pump suction pipe (draws from below) -->
  <rect x="1000" y="300" width="15" height="252" fill="#5A6B7A"/>
  <rect x="972" y="541" width="43" height="14" fill="#5A6B7A"/>
  <line x1="1007" y1="300" x2="1007" y2="248" stroke="#1E3A5F" stroke-width="3" marker-end="url(#navy)"/>
  <text x="1080" y="244" text-anchor="end" font-size="12" font-weight="700" fill="#15263F">&#8594; pump &#8594; main spray tank</text>
  <circle cx="912" cy="466" r="15" fill="#D99A16"/><text x="912" y="471" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="912" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#15263F">pump draws CLEAN water</text>
  <text x="912" y="516" text-anchor="middle" font-size="11" fill="#5E6B78">from BELOW the surface</text>

  <!-- Magnet rods bottom -->
  <g fill="#7d8b98" stroke="#5a6773">
    <rect x="636" y="560" width="9" height="34"/><rect x="672" y="560" width="9" height="34"/><rect x="708" y="560" width="9" height="34"/>
  </g>
  <text x="628" y="552" font-size="10.5" fill="#5E6B78">Magnet rods (existing): ferrous metal only</text>

  <!-- existing bottom flow note -->
  <rect x="460" y="562" width="9" height="10" fill="#B23B2E" opacity="0.55"/>
  <text x="230" y="576" font-size="10.5" font-style="italic" fill="#B23B2E">existing bottom flow &#8594; leaves floaters behind (that's the problem we fix)</text>

  <!-- Legend -->
  <rect x="66" y="632" width="1018" height="140" rx="8" fill="#F3F6FA" stroke="#D8E0E8"/>
  <text x="88" y="658" font-size="13.5" font-weight="700" fill="#15263F">How it works</text>
  <g font-size="12.5" fill="#1C2833">
    <text x="88" y="682"><tspan font-weight="700" fill="#D99A16">1</tspan><tspan dx="9">Surface weir skims the top film &#8212; where lint, fibre &amp; oil float.</tspan></text>
    <text x="88" y="706"><tspan font-weight="700" fill="#D99A16">2</tspan><tspan dx="9">Inclined SS-mesh screen: solids stay on top &amp; are raked off; water drains through.</tspan></text>
    <text x="88" y="730"><tspan font-weight="700" fill="#D99A16">3</tspan><tspan dx="9">Pump suction takes CLEAN water from below the surface.</tspan></text>
    <text x="600" y="682"><tspan font-weight="700" fill="#D99A16">4</tspan><tspan dx="9">Baffle blocks any leftover surface film from reaching the pump.</tspan></text>
    <text x="600" y="706"><tspan font-weight="700" fill="#3E6FA3">&#9679;</tspan><tspan dx="9">Magnet rods you already have keep catching ferrous metal.</tspan></text>
    <text x="600" y="730"><tspan font-weight="700" fill="#2E7D5B">&#9873;</tspan><tspan dx="9">Build from scrap SS mesh + angle-iron / PVC frame &#8212; gravity only.</tspan></text>
    <text x="88" y="756" font-size="11.5" font-style="italic" fill="#B23B2E">Safety: hot &amp; alkaline &#8212; long handles, chemical gloves, apron, face shield. Keep the fall gentle to avoid foam; don't drain the pump tank below minimum level.</text>
  </g>
</svg>
